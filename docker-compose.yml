services:
  app:
    build: .
    container_name: weather-api
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
    restart: unless-stopped
  
  redis:
    image: redis:latest
    container_name: weather-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data: